<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>光谷未来实验教育集团“发现那棵树·看见成长的力量”分享会</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --text: #1d1d1f;
      --muted: #6e6e73;
      --soft: rgba(255, 255, 255, 0.76);
      --soft-strong: rgba(255, 255, 255, 0.9);
      --line: rgba(255, 255, 255, 0.68);
      --shadow: 0 18px 54px rgba(33, 47, 69, 0.11);
      --shadow-soft: 0 10px 28px rgba(33, 47, 69, 0.09);
      --accent: #2f7d5a;
      --accent-2: #5e8fb8;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;
      background:
        linear-gradient(135deg, #f3f6f8 0%, #edf1f4 48%, #e7ecef 100%);
      overflow-x: hidden;
    }

    html.modal-open,
    body.modal-open {
      overflow: hidden;
    }

    body::before {
      display: none;
    }

    button {
      font: inherit;
      min-width: 44px;
      min-height: 44px;
      touch-action: manipulation;
    }

    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px max(14px, env(safe-area-inset-left)) max(28px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-right));
    }

    .footer-panel,
    .modal-card {
      border: 1px solid var(--line);
      background: var(--soft);
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(24px) saturate(1.35);
      backdrop-filter: blur(24px) saturate(1.35);
    }

    .main-panel {
      min-height: calc(100vh - 186px);
      padding: 0;
      position: relative;
      overflow: visible;
    }

    .main-panel::after {
      display: none;
    }

    .hero,
    .card-grid {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: none;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(47, 125, 90, 0.1);
    }

    .hero {
      display: grid;
      place-items: center;
      min-height: 126px;
      margin: 0 0 24px;
      padding: 28px 20px 26px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.68);
      box-shadow: 0 14px 38px rgba(33, 47, 69, 0.08);
      -webkit-backdrop-filter: blur(24px) saturate(1.35);
      backdrop-filter: blur(24px) saturate(1.35);
      text-align: center;
    }

    h1 {
      max-width: 820px;
      margin: 0 0 8px;
      font-size: 1.72rem;
      line-height: 1.2;
      font-weight: 780;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 660px;
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.5;
      font-weight: 520;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      width: min(100%, 980px);
      margin: 0 auto;
      perspective: 1200px;
    }

    .card {
      appearance: none;
      display: flex;
      min-width: 0;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
      text-align: left;
      color: inherit;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.76);
      box-shadow: var(--shadow-soft);
      -webkit-backdrop-filter: blur(20px) saturate(1.25);
      backdrop-filter: blur(20px) saturate(1.25);
      cursor: pointer;
      transform: translateY(0) rotateY(0deg);
      opacity: 0;
      animation: flipIn 720ms cubic-bezier(0.2, 0.82, 0.22, 1) forwards;
      transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease, background 220ms ease;
    }

    .card:nth-child(1) { animation-delay: 70ms; }
    .card:nth-child(2) { animation-delay: 150ms; }
    .card:nth-child(3) { animation-delay: 230ms; }
    .card:nth-child(4) { animation-delay: 310ms; }
    .card:nth-child(5) { animation-delay: 390ms; }
    .card:nth-child(6) { animation-delay: 470ms; }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-7px);
      border-color: rgba(255, 255, 255, 0.95);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 24px 54px rgba(33, 47, 69, 0.16);
      outline: none;
    }

    .cover {
      height: 150px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.68);
      background-color: rgba(255, 255, 255, 0.38);
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 54%, rgba(255, 255, 255, 0.28));
    }

    .card-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 7px;
      padding: 12px 12px 12px;
    }

    .card-title {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.24;
      font-weight: 760;
    }

    .card-kicker {
      margin: 2px 0 0;
      color: #3e6f80;
      font-size: 0.72rem;
      font-weight: 690;
      line-height: 1.38;
    }

    .card-desc {
      margin: 0;
      color: var(--muted);
      font-size: 0.68rem;
      line-height: 1.55;
      flex: 1;
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .footer-panel {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
      margin-top: 18px;
      border-radius: var(--radius);
      padding: 20px;
      animation: floatPanel 5.2s ease-in-out infinite;
    }

    .footer-title {
      margin: 0 0 8px;
      font-size: 1.05rem;
      font-weight: 760;
    }

    .footer-copy {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.72;
    }

    .qr-wrap {
      display: grid;
      place-items: center;
      width: 110px;
      height: 110px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 10px 28px rgba(33, 47, 69, 0.1);
      overflow: hidden;
    }

    .qr-wrap img {
      display: block;
      width: 96px;
      height: 96px;
      object-fit: contain;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      background: rgba(244, 247, 250, 0.48);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      overscroll-behavior: contain;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(560px, 100%);
      max-height: min(720px, calc(100vh - 40px));
      max-height: min(720px, calc(100dvh - 40px));
      overflow: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      border-radius: var(--radius);
      padding: 24px;
      transform: translateY(12px) scale(0.98);
      opacity: 0;
      animation: modalIn 240ms ease forwards;
    }

    @supports not (height: 100dvh) {
      .modal-card {
        max-height: min(720px, calc(100vh - 40px));
      }
    }

    .modal-top {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
      position: sticky;
      top: 0;
      z-index: 1;
      padding-bottom: 10px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.58));
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      backdrop-filter: blur(18px) saturate(1.2);
    }

    .modal h2 {
      margin: 0;
      font-size: 1.28rem;
      line-height: 1.35;
    }

    .modal-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .close-btn {
      display: inline-grid;
      place-items: center;
      position: relative;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border: 1px solid rgba(29, 29, 31, 0.08);
      border-radius: 50%;
      color: var(--text);
      background: rgba(255, 255, 255, 0.64);
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }

    .close-btn:hover,
    .close-btn:focus-visible {
      transform: rotate(90deg);
      background: rgba(255, 255, 255, 0.9);
      outline: none;
    }

    .close-btn::before,
    .close-btn::after {
      content: "";
      position: absolute;
      width: 15px;
      height: 1.5px;
      border-radius: 999px;
      background: currentColor;
    }

    .close-btn::before { transform: rotate(45deg); }
    .close-btn::after { transform: rotate(-45deg); }

    .modal-section-title {
      margin: 18px 0 10px;
      color: #2e654d;
      font-size: 0.94rem;
      font-weight: 760;
    }

    .manual-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .manual-list li {
      padding: 11px 12px;
      border: 1px solid rgba(29, 29, 31, 0.06);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.5);
      color: #2b2b2f;
      font-size: 0.94rem;
      line-height: 1.42;
    }

    @keyframes flipIn {
      from {
        opacity: 0;
        transform: translateY(24px) rotateY(-16deg) rotateX(5deg);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotateY(0deg) rotateX(0deg);
        filter: blur(0);
      }
    }

    @keyframes modalIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes floatPanel {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 920px) {
      .card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: min(100%, 680px);
      }
    }

    @media (hover: none) and (pointer: coarse) {
      .card:hover {
        transform: none;
      }

      .card:active {
        transform: scale(0.99);
      }
    }

    @media (max-width: 760px) {
      .page {
        width: min(100%, 620px);
        padding-top: 14px;
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }

      .main-panel {
        min-height: auto;
        padding: 0;
      }

      .hero {
        min-height: 102px;
        margin-bottom: 16px;
        padding: 20px 14px 18px;
        border-radius: 12px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 1.24rem;
        line-height: 1.24;
      }

      .subtitle {
        font-size: 0.68rem;
        line-height: 1.52;
      }

      .card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
        gap: 12px;
      }

      .cover {
        height: 112px;
      }

      .card-body {
        gap: 6px;
        padding: 10px;
      }

      .card-title {
        font-size: 0.82rem;
      }

      .card-kicker {
        font-size: 0.66rem;
      }

      .card-desc {
        font-size: 0.62rem;
        line-height: 1.48;
        -webkit-line-clamp: 3;
      }

      .footer-panel {
        grid-template-columns: 1fr;
        justify-items: start;
        gap: 14px;
        padding: 16px;
      }

      .qr-wrap {
        width: 104px;
        height: 104px;
      }

      .qr-wrap img {
        width: 92px;
        height: 92px;
      }

      .modal {
        align-items: flex-end;
        padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      }

      .modal-card {
        width: 100%;
        padding: 18px 16px max(16px, env(safe-area-inset-bottom));
        max-height: calc(100vh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        max-height: calc(100dvh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        border-radius: 14px 14px 8px 8px;
      }

      @supports not (height: 100dvh) {
        .modal-card {
          max-height: calc(100vh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        }
      }

      .modal h2 {
        font-size: 1.12rem;
      }

      .modal-subtitle,
      .modal-section-title,
      .manual-list li {
        font-size: 0.9rem;
      }
    }

    @media (max-width: 640px) {
      .page {
        width: 100%;
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
      }

      .hero {
        min-height: auto;
      }

      .card-grid {
        grid-template-columns: 1fr;
        max-width: 430px;
      }

      .cover {
        height: 146px;
      }

      .card-desc {
        display: block;
        overflow: visible;
        -webkit-line-clamp: initial;
      }

      .footer-copy {
        font-size: 0.86rem;
        line-height: 1.66;
      }
    }

    @media (max-width: 360px) {
      h1 {
        font-size: 1.12rem;
      }

      .cover {
        height: 132px;
      }

      .modal-card {
        padding-left: 14px;
        padding-right: 14px;
      }
    }
  </style>
</head>

  <div class="page">
    <main class="main-panel" aria-labelledby="page-title">
      <section class="hero">
        <div class="eyebrow">光谷未来实验教育集团</div>
        <h1 id="page-title">光谷未来实验教育集团分享会</h1>
        <p class="subtitle">“发现那棵树·看见成长的力量”</p>
      </section>

      <section class="card-grid" id="cardGrid" aria-label="分享会内容卡片"></section>
    </main>

    const grid = document.getElementById("cardGrid");

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"

    function svgData(svg) {
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;

            <circle cx="450" cy="306" r="34" fill="${accent}" opacity="0.66"/>
            <circle cx="342" cy="386" r="26" fill="#ffffff" opacity="0.84"/>

        learning: `
          <g filter="url(#softShadow)">

        `,

          </g>
          <path d="M210 470 C318 440 590 440 704 472" stroke="rgba(99,74,53,0.2)" stroke-width="8" fill="none" stroke-linecap="round"/>
        `,
        art: `
          <g filter="url(#softShadow)">

            <rect x="388" y="112" width="150" height="180" rx="16" fill="rgba(255,255,255,0.58)"/>

      return `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="${esc(card.title)}场景封面">

          ${scenes[card.scene]}
        </svg>
      `;
    }

    function renderCards() {
      grid.innerHTML = cards.map((card) => {
        return `
          <article class="card" tabindex="0" data-card-id="${esc(card.id)}">
            <div class="cover" style="background-image:url('${svgData(coverSvg(card))}')"></div>
            <div class="card-body">
              <div>
                <h3 class="card-title">${esc(card.title)}</h3>
                <p class="card-kicker">${esc(card.kicker)}</p>
              </div>
              <p class="card-desc">${esc(card.desc)}</p>
            </div>
          </article>
        `;
      }).join("");
    }

    function openModal(card) {
      modalTitle.textContent = card.title;
      modalSubtitle.textContent = card.kicker;
      modalSectionTitle.textContent = card.id === "art" || card.id === "hall" ? "现场内容：" : "成果手册：";
      manualList.innerHTML = card.manuals.map((item) => `<li>${esc(item)}</li>`).join("");
      modalCard.scrollTop = 0;
      modal.classList.add("show");
      document.documentElement.classList.add("modal-open");
      document.body.classList.add("modal-open");
      closeModal.focus();
    }

    function hideModal() {
      modal.classList.remove("show");
      document.documentElement.classList.remove("modal-open");
      document.body.classList.remove("modal-open");
    }

    renderCards();

    grid.addEventListener("click", (event) => {
      const cardEl = event.target.closest("[data-card-id]");
      if (!cardEl) return;
      const card = cards.find((item) => item.id === cardEl.dataset.cardId);
      if (card) openModal(card);
    });

    grid.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const cardEl = event.target.closest("[data-card-id]");
      if (!cardEl) return;
      event.preventDefault();
      const card = cards.find((item) => item.id === cardEl.dataset.cardId);
      if (card) openModal(card);
    });

    closeModal.addEventListener("click", hideModal);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) hideModal();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modal.classList.contains("show")) hideModal();
    });

  </script>
